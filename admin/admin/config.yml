backend:
  name: git-gateway
  branch: main

# Where uploaded images will be stored in your project
media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "catalog"
    label: "Product Catalog"
    files:
      - file: "products.json"
        label: "Products"
        name: "products"
        fields:
          - label: "Product List"
            name: "items"
            widget: "list"
            fields:
              - { label: "Product Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Product Photo", name: "image", widget: "image" }